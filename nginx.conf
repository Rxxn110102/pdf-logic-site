# PDF逻辑解析工具 · Nginx 配置（install.sh 会自动安装到 /etc/nginx/conf.d/pdf-logic.conf）
# 绑定域名后，把 server_name 的 _ 换成你的域名，再申请 HTTPS 证书。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # 前端组件可长期缓存
    location /vendor/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        expires 7d;
    }

    # AI 分析接口：关闭缓冲，才能逐字显示结果
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
}
